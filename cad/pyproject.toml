[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stratum-cad"
version = "0.1.0"
description = "Deterministic CAD compiler, metrics, and thermal simulator for Stratum"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.7.0",
    "trimesh>=4.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stratum_cad*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
